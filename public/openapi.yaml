openapi: 3.0.3
info:
  title: URL Shortener API
  version: 1.0.0
  description: |
    A small REST API for creating and resolving short links.
    All responses are JSON. Request bodies may be JSON or form-encoded.
servers:
  - url: http://localhost:3000
paths:
  /api/urls:
    post:
      summary: Create a short link
      description: |
        Returns 201 for a new link. If the URL has already been shortened,
        the existing link is returned with 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUrl'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateUrl'
      responses:
        '201':
          description: Short link created
          headers:
            Location:
              description: Path of the created resource
              schema: { type: string, example: /api/urls/aB3dE9x }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '200':
          description: URL was already shortened; existing link returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      summary: List recent short links
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Most recently created links first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Link' }
  /api/urls/{code}:
    get:
      summary: Look up a short link
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9]{7}$' }
      responses:
        '200':
          description: The short link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '404': { $ref: '#/components/responses/Error' }
  /{code}:
    get:
      summary: Redirect to the original URL
      description: Increments the visit counter and responds with a 302 redirect.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9]{7}$' }
      responses:
        '302':
          description: Redirect to the original URL
          headers:
            Location:
              schema: { type: string, format: uri }
        '404':
          description: Unknown code (HTML page)
components:
  schemas:
    CreateUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Absolute http or https URL
          example: https://example.com/some/long/path
    Link:
      type: object
      properties:
        code: { type: string, example: aB3dE9x }
        shortUrl: { type: string, format: uri, example: http://localhost:3000/aB3dE9x }
        originalUrl: { type: string, format: uri, example: https://example.com/some/long/path }
        createdAt: { type: string, format: date-time }
        visits: { type: integer, example: 0 }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: invalid_url }
            message: { type: string, example: Please provide a valid http(s) URL (max 2048 characters). }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
